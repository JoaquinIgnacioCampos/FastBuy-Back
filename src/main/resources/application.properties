spring.application.name=FastBuy-Back

# Hosts (e.g. Render) inject the port via PORT; default to 8080 locally.
server.port=${PORT:8080}

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:fastbuydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Let schema.sql/data.sql handle all DDL — Hibernate must NOT auto-create
spring.jpa.hibernate.ddl-auto=none

# Ensure SQL init scripts run, and run AFTER Hibernate sets up the datasource
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Mercado Pago Checkout Pro. When blank, /payments/preference falls back to a
# simulated init_point that immediately resolves on the frontend (handy for
# local dev without an MP sandbox account). Set MP_ACCESS_TOKEN env var to
# enable real sandbox / production charges.
mercadopago.access-token=${MP_ACCESS_TOKEN:}
# true = use sandbox_init_point (test accounts); false = use init_point (production).
mercadopago.sandbox=${MP_SANDBOX:false}
# Origin used to build back_urls for both real and simulated flows.
fastbuy.web-origin=${FASTBUY_WEB_ORIGIN:http://localhost:5173}
# Key/salt (salt = hex) for encrypting per-event MP tokens at rest. Set in prod.
fastbuy.token-key=${FASTBUY_TOKEN_KEY:dev-insecure-token-key}
fastbuy.token-salt=${FASTBUY_TOKEN_SALT:5c0744940b5c369b}
# MP OAuth — seller onboarding. Set MP_APP_ID, MP_APP_SECRET, and MP_REDIRECT_URI.
# MP_REDIRECT_URI must be registered in the MP app's allowed redirect URIs.
# Local:  https://crepe-phonics-slogan.ngrok-free.dev/api/auth/mp/callback
# Prod:   https://fastbuy-back.onrender.com/auth/mp/callback
mp.app.id=${MP_APP_ID:}
mp.app.secret=${MP_APP_SECRET:}
mp.redirect.uri=${MP_REDIRECT_URI:}
