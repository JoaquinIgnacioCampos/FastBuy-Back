spring.application.name=FastBuy-Back

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:fastbuydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Let schema.sql/data.sql handle all DDL — Hibernate must NOT auto-create
spring.jpa.hibernate.ddl-auto=none

# Ensure SQL init scripts run, and run AFTER Hibernate sets up the datasource
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
