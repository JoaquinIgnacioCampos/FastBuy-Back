# Production profile (activate with SPRING_PROFILES_ACTIVE=prod).
# Datasource credentials come from the host's env vars via relaxed binding:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<pass>
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema + seed are applied once, out-of-band (deploy/postgres-init.sql).
# Never re-run init scripts against the persistent DB on boot.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none

# No H2 console in production.
spring.h2.console.enabled=false

# Cross-origin frontend (Cloudflare Pages). Set via env on the host.
#   FASTBUY_CORS_ORIGINS=https://<project>.pages.dev
#   FASTBUY_WEB_ORIGIN=https://<project>.pages.dev
